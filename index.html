<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Трекер контракта</title>
<link rel="apple-touch-icon" id="ati">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Контракт">
<meta name="theme-color" content="#4a5a2b">
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8ebe4;--card:#f6f7f2;--tx:#1b231d;--mut:#667066;--ac:#4a5a2b;--ac2:#dfe5d2;--bd:#d3d9cb;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141914;--card:#1d241d;--tx:#e6ebe0;--mut:#93a091;--ac:#a7bd6a;--ac2:#2a3322;--bd:#2e382d;--on:#141914;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141914;--card:#1d241d;--tx:#e6ebe0;--mut:#93a091;--ac:#a7bd6a;--ac2:#2a3322;--bd:#2e382d;--on:#141914;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:14px 14px 84px;max-width:560px;margin:0 auto}
h1,h2,.big{font-family:"Saira Condensed","Arial Narrow",system-ui,sans-serif;margin:0}
h2{font-size:20px;font-weight:700;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin:10px 0}
.big{font-size:64px;font-weight:700;line-height:1;color:var(--ac)}
.mut{color:var(--mut);font-size:14px}
.bar{height:12px;background:var(--ac2);border-radius:6px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:var(--ac)}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--ac);color:var(--on);border:0;border-radius:8px;padding:10px 14px;font-weight:600}
button.sec{background:var(--ac2);color:var(--tx)}
input,select,textarea{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px;width:100%}
label{display:block;margin:8px 0 4px;font-size:14px;color:var(--mut)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;color:var(--mut);padding:10px 2px;font-size:14px}
nav button.on{color:var(--ac);box-shadow:inset 0 2px 0 var(--ac)}
.hd{display:flex;align-items:center;justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dw{text-align:center;font-size:12px;color:var(--mut)}
.d{aspect-ratio:1;border-radius:8px;border:1px solid var(--bd);background:var(--card);padding:3px;font-size:11px;display:flex;flex-direction:column;justify-content:space-between;color:var(--tx);text-align:left;font-weight:500}
.d b{align-self:center;font-size:14px}
.d.x{opacity:.35}
.d.s{outline:3px solid var(--ac);outline-offset:1px}
.chips{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:6px}
.chips button{padding:9px 0;font-size:14px;color:#fff}
.row{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:14px}
.row span:first-child{width:92px;flex:none}
.row .bar{flex:1;margin:0;height:10px}
.row em{font-style:normal;width:34px;text-align:right;flex:none}
.flex{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.warn{color:#b5651d}
</style></head><body>
<div id="app"></div>
<nav id="nav"></nav>
<script>
const CODES={'н':['К','#7a7a3a'],'кп':['КП','#1f7a6b'],'у':['У','#5b8a2f'],'з':['З','#3b6fb5'],'р':['Р','#a8801c'],'к':['Ком','#7a4fb0'],'б':['Б','#b5483b'],'в':['В','#6d7a72'],'о':['О','#8d9b92'],'отп':['Отп','#b0628f'],'оц':['Оц','#2f6f8f'],'удн':['Уч-д','#c0622b'],'усу':['Уч-с','#a83a2b']};
const MN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const POSTC='#4a5a2b';
let S={start:'',end:'',days:{},filled:{}};
try{const r=localStorage.getItem('ct1');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem('ct1',JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const dn=s=>{const a=s.split('-').map(Number);return Math.round(Date.UTC(a[0],a[1]-1,a[2])/864e5)};
const fromDn=n=>{const t=new Date(n*864e5);return t.getUTCFullYear()+'-'+pad(t.getUTCMonth()+1)+'-'+pad(t.getUTCDate())};
const today=()=>{const t=new Date();return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate())};
const dim=(y,m)=>new Date(y,m,0).getDate();
const gs=()=>{let m='';for(const k in S.days){if(isDuty(S.days[k])&&k>=S.start&&(!m||k<m))m=k}return m||S.start};
const isPost=c=>/^\d\/\d$/.test(c);
const isDuty=c=>isPost(c)||c==='кп'||c==='у'||c==='н';
const lab=c=>CODES[c]?CODES[c][0]:c;
const col=c=>CODES[c]?CODES[c][1]:POSTC;
const ymName=ym=>{const a=ym.split('-');return MN[a[1]-1]+' '+a[0]};
let tab='home',cur='',sel=[],range=false,anchor='',lastDuty='',msg='',per='all';
const inPer=(k,p)=>{if(p==='all')return true;const n=p==='30'?30:p==='3'?91:365;return k<=today()&&dn(k)>dn(today())-n};
function perBar(){return '<div class="flex" style="margin:0 0 6px">'+[['all','Всё время'],['30','30 дней'],['3','3 мес.'],['12','Год']].map(x=>'<button class="'+(per===x[0]?'':'sec')+'" onclick="per=\''+x[0]+'\';render()">'+x[1]+'</button>').join('')+'</div>'}
function agenda(){const w=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'],t=dn(today());let h='<h2>Повестка</h2><div class="card">';
 for(let i=0;i<7;i++){const k=fromDn(t+i),c=S.days[k],d=new Date((t+i)*864e5),nm=i===0?'Сегодня':i===1?'Завтра':w[d.getUTCDay()]+' '+k.slice(8)+'.'+k.slice(5,7);
  h+='<div class="row"><span>'+nm+'</span><div style="flex:1">'+(c?'<b style="background:'+col(c)+';color:#fff;border-radius:6px;padding:2px 10px">'+lab(c)+'</b>':'<small class="mut">не заполнено</small>')+'</div></div>'}
 return h+'</div>'}

function months(){const b=S.end.slice(0,7),r=[];let a=S.start.slice(0,7).split('-').map(Number),y=a[0],m=a[1];
 while(r.length<240){const k=y+'-'+pad(m);r.push(k);if(k>=b)break;m++;if(m>12){m=1;y++}}return r}
function filledDays(){const out=[],last={};for(const k in S.days){const m=k.slice(0,7);if(!last[m]||k>last[m])last[m]=k}
 months().forEach(ym=>{if(!S.filled[ym]&&!last[ym])return;const a=ym.split('-').map(Number),n=dim(a[0],a[1]),lim=S.filled[ym]?ym+'-'+pad(n):last[ym];
  for(let d=1;d<=n;d++){const k=ym+'-'+pad(d);if(k>lim||k<gs()||k<S.start||k>S.end)continue;out.push([k,S.days[k]||'в'])}});return out}
function filledDaysOld(){const out=[];months().forEach(ym=>{if(!S.filled[ym])return;const a=ym.split('-').map(Number);
 for(let d=1;d<=dim(a[0],a[1]);d++){const k=ym+'-'+pad(d);if(k<gs()||k>S.end)continue;out.push([k,S.days[k]||'в'])}});return out}
function lastFilled(){let l=0;months().forEach(ym=>{if(!S.filled[ym])return;const a=ym.split('-').map(Number);let e=ym+'-'+pad(dim(a[0],a[1]));if(e>S.end)e=S.end;l=Math.max(l,dn(e))});return l}
function stats(p){p=p||'all';const cnt={},post={},shift={},mon={},duty=[];const list=filledDays().filter(x=>inPer(x[0],p));
 list.forEach(x=>{const k=x[0],c=x[1];cnt[c]=(cnt[c]||0)+1;
  if(isDuty(c)){duty.push(dn(k));mon[k.slice(0,7)]=(mon[k.slice(0,7)]||0)+1}
  if(isPost(c)){const p=c.split('/');post[p[0]]=(post[p[0]]||0)+1;shift[p[1]]=(shift[p[1]]||0)+1}});
 const gaps={};for(let i=1;i<duty.length;i++){const g=duty[i]-duty[i-1];gaps[g]=(gaps[g]||0)+1}
 return{cnt,post,shift,mon,gaps,tot:list.length,dutyN:duty.length}}
function row(l,v,max,c){return '<div class="row"><span>'+l+'</span><div class="bar"><i style="width:'+(max?Math.round(v/max*100):0)+'%;background:'+(c||'var(--ac)')+'"></i></div><em>'+v+'</em></div>'}

function setup(){return '<h1 style="font-size:32px">Трекер контракта</h1><div class="card"><p class="mut">Укажи даты контракта. Потом приложение попросит заполнить график по месяцам с самого начала.</p><label>Начало контракта</label><input type="date" id="s"><label>Конец контракта</label><input type="date" id="e"><div class="mut">КМБ и стажировки вводить не нужно: статистика начнётся с первых суток в твоём графике.</div><div class="flex"><button onclick="saveDates()">Начать</button></div><p class="warn">'+msg+'</p></div>'}
function saveDates(){const s=$('#s').value,e=$('#e').value;if(!s||!e||s>=e){msg='Конец должен быть позже начала';render();return}
 S.start=s;S.end=e;save();msg='';cur='';render()}

function home(){const tot=dn(S.end)-dn(S.start)+1,t=dn(today());
 const passed=Math.max(0,Math.min(tot,t-dn(S.start)+1)),left=Math.max(0,dn(S.end)-t),pct=Math.round(passed/tot*100);
 const nowYm=today().slice(0,7),need=months().filter(m=>m<=nowYm&&m>=gs().slice(0,7)&&!S.filled[m]&&!Object.keys(S.days).some(k=>k.slice(0,7)===m));
 let h='<div class="card"><div class="mut">До конца контракта</div><div class="big">'+left+'</div><div>'+(left%10===1&&left%100!==11?'день':(left%10>=2&&left%10<=4&&(left%100<10||left%100>=20)?'дня':'дней'))+', примерно '+(left/30.4).toFixed(1)+' мес.</div><div class="bar"><i style="width:'+pct+'%"></i></div><div class="mut">Пройдено '+passed+' из '+tot+' дн. ('+pct+'%)</div></div>';
 if(!Object.keys(S.days).some(k=>isDuty(S.days[k])))h+='<div class="card"><b>Отметь первые сутки</b><div class="mut">Статистика начнётся с первых суток в графике. КМБ и стажировки вводить не нужно.</div><div class="flex"><button onclick="goMonth(\''+nowYm+'\')">Открыть календарь</button></div></div>';else if(need.length)h+='<div class="card"><b>Заполни график: '+ymName(need[0])+'</b><div class="mut">Незаполненных месяцев: '+need.length+'</div><div class="flex"><button onclick="goMonth(\''+need[0]+'\')">Открыть месяц</button></div></div>';
 const st=stats(),rem=Math.max(0,dn(S.end)-dn(today()));
 h+=agenda()+'<h2>Прогноз до конца контракта</h2>';
 if(!st.tot)h+='<div class="card mut">Заполни хотя бы один месяц, и здесь появится прогноз.</div>';
 else if(rem<=0)h+='<div class="card mut">Контракт закончился.</div>';
 else{const fr=(l,n,c)=>'<div class="row"><span>'+l+'</span><div class="bar"><i style="width:'+Math.round(n/st.tot*100)+'%;background:'+c+'"></i></div><em style="width:86px">≈'+Math.round(n/st.tot*rem)+' · '+Math.round(n/st.tot*100)+'%</em></div>';
  h+='<div class="card"><div class="mut">С сегодняшнего дня до конца контракта '+rem+' дн. Слева примерное число дней, справа вероятность, что любой день окажется таким (по твоему графику).</div>'+
  [['Суток',st.dutyN,POSTC],['Отсыпных',st.cnt['о']||0,col('о')],['Выходных',st.cnt['в']||0,col('в')],['Занятий',st.cnt['з']||0,col('з')],['Рабочих',st.cnt['р']||0,col('р')],['Учений',(st.cnt['удн']||0)+(st.cnt['усу']||0),col('удн')],['Оцеплений',st.cnt['оц']||0,col('оц')]].sort((a,b)=>b[1]-a[1]).map(x=>fr(x[0],x[1],x[2])).join('')+
  '<div class="mut" style="margin-top:8px">Это примерная оценка. Чем больше месяцев заполнено, тем точнее.</div></div>'}
 return h}

function goMonth(m){cur=m;tab='cal';sel=[];render()}
function cal(){const ms=months();if(!ms.includes(cur)){const n=today().slice(0,7);cur=ms.includes(n)?n:ms[0]}
 const a=cur.split('-').map(Number),y=a[0],m=a[1],first=(new Date(y,m-1,1).getDay()+6)%7,n=dim(y,m);
 let h='<div class="hd"><button class="sec" onclick="nav(-1)">‹</button><h1 style="font-size:24px">'+ymName(cur)+'</h1><button class="sec" onclick="nav(1)">›</button></div>';
 h+='<div class="mut" style="text-align:center;margin:4px 0 8px">'+(S.filled[cur]?'Месяц отмечен как законченный ✓':'В статистику идут дни до последней отмеченной даты')+'</div><div class="grid">';
 ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].forEach(w=>h+='<div class="dw">'+w+'</div>');
 for(let i=0;i<first;i++)h+='<div></div>';
 for(let d=1;d<=n;d++){const k=cur+'-'+pad(d),c=S.days[k],out=k<S.start||k>S.end;
  h+='<button class="d'+(out?' x':'')+(sel.includes(k)?' s':'')+'" '+(out?'disabled':'onclick="pickDay(\''+k+'\')"')+(c?' style="background:'+col(c)+';color:#fff;border-color:'+col(c)+'"':'')+'><b>'+d+'</b><span>'+(c?lab(c):'')+'</span></button>'}
 h+='</div><div class="card"><div class="hd"><b>'+(sel.length?(sel.length>1?sel.length+' дн. выбрано':sel[0].slice(8)+'.'+sel[0].slice(5,7)):'Выбери день')+'</b><label style="margin:0;display:flex;gap:6px;align-items:center"><input type="checkbox" style="width:auto" '+(range?'checked':'')+' onchange="range=this.checked;anchor=\'\';sel=[];render()">Диапазон</label></div>';
 h+='<div class="mut" style="margin-top:6px">Пост и смена (4/1 = пост 4, смена 1)</div><div class="chips">';
 for(let s=1;s<=2;s++)for(let p=4;p<=9;p++)h+='<button style="background:'+POSTC+'" onclick="apply(\''+p+'/'+s+'\')">'+p+'/'+s+'</button>';
 h+='</div><div class="mut" style="margin-top:8px">Другое</div><div class="chips">';
 Object.keys(CODES).forEach(c=>h+='<button style="background:'+col(c)+'" onclick="apply(\''+c+'\')">'+lab(c)+'</button>');
 h+='<button class="sec" style="color:var(--tx)" onclick="clearDay()">Стереть</button></div>'+
 '<div class="mut" style="margin-top:8px">К: караул (пост ещё не указан). Потом выбери этот день и поставь пост, он заменится. После наряда следующий пустой день автоматически становится отсыпным (О).</div></div>'+
 '<div class="card"><b>Цикл до конца месяца</b><div class="mut">Берёт выбранный день как первый наряд (код — последний выбранный пост/КП/У).</div><div class="flex"><select id="cy" style="flex:1"><option value="3">Сутки-двое</option><option value="4">Через трое</option><option value="5">Через четверо</option></select><button class="sec" onclick="cycle()">Заполнить</button></div></div>'+
 '<div class="flex"><button onclick="toggleFilled()">'+(S.filled[cur]?'Снять отметку «закончен»':'Месяц закончен ✓')+'</button></div><p class="mut">Статистика считается автоматически по отмеченным дням. Кнопку «Месяц закончен» нажимай, когда месяц прошёл: тогда пустые дни до его конца считаются выходными. Пропущенные дни между отмеченными тоже считаются выходными.</p><p class="warn">'+msg+'</p>';
 return h}
function legend(){const L=[['К','Караул','#7a7a3a'],['КП','Заступаю на КПП','#1f7a6b'],['У','Усиление','#5b8a2f'],['Оц','Оцепление','#2f6f8f'],['Уч-д','Учения дневные','#c0622b'],['Уч-с','Учения суточные','#a83a2b'],['З','Занятия','#3b6fb5'],['Р','Рабочий день 8:00–17:00','#a8801c'],['Ком','Командировка','#7a4fb0'],['Б','Больничный','#b5483b'],['В','Выходной','#6d7a72'],['О','Отсыпной','#8d9b92'],['Отп','Отпуск','#b0628f'],['4/1','Пост 4, смена 1 (посты 4–9, смены 1–2)',POSTC]];
 return '<h2>Обозначения</h2><div class="card">'+L.map(x=>'<div class="row"><b style="background:'+x[2]+';color:#fff;border-radius:6px;padding:2px 8px;min-width:50px;text-align:center;flex:none">'+x[0]+'</b><span style="width:auto">'+x[1]+'</span></div>').join('')+'</div>'}
function nav(d){const ms=months(),i=ms.indexOf(cur)+d;if(i>=0&&i<ms.length){cur=ms[i];sel=[];anchor=''}render()}
function pickDay(k){msg='';if(range){if(anchor){const a=dn(anchor),b=dn(k),lo=Math.min(a,b),hi=Math.max(a,b);sel=[];for(let i=lo;i<=hi;i++)sel.push(fromDn(i));anchor=''}else{anchor=k;sel=[k]}}else sel=[k];render()}
function apply(c){msg='';if(!sel.length){msg='Сначала выбери день';render();return}
 sel.forEach(k=>{if(k>=S.start&&k<=S.end)S.days[k]=c});
 if(isDuty(c))lastDuty=c;
 if(sel.length===1){const base=dn(sel[0]);
  if(isDuty(c)){const nx=fromDn(base+1);if(!S.days[nx]&&nx<=S.end)S.days[nx]='о'}
  let n=base+1;while(S.days[fromDn(n)]&&n<base+40)n++;const nk=fromDn(n);sel=nk.slice(0,7)===cur&&nk<=S.end?[nk]:[]}
 save();render()}
function clearDay(){sel.forEach(k=>delete S.days[k]);save();render()}
function cycle(){msg='';if(!sel.length||sel.length>1){msg='Выбери один день, с которого начинается цикл';render();return}
 if(!lastDuty){msg='Сначала поставь любой наряд (пост, КП или У), он будет использоваться в цикле';render();return}
 const L=+$('#cy').value,base=dn(sel[0]),a=cur.split('-').map(Number),end=dn(cur+'-'+pad(dim(a[0],a[1])));
 for(let i=base;i<=end;i++){const k=fromDn(i);if(k>S.end)break;const p=(i-base)%L;S.days[k]=p===0?lastDuty:(p===1?'о':'в')}
 save();render()}
function toggleFilled(){if(S.filled[cur])delete S.filled[cur];else S.filled[cur]=true;save();render()}

function statsView(){const st=stats(per);if(!st.tot)return '<h1 style="font-size:28px">Статистика</h1>'+perBar()+'<div class="card mut">Нет данных за этот период. Отметь дни в календаре.</div>';
 const keys=['н','кп','у','оц','удн','усу','з','р','к','б','в','о','отп'];
 let h='<h1 style="font-size:28px">Статистика</h1>'+perBar()+'<div class="card"><div class="mut">Всего суток (нарядов)</div><div class="big">'+st.dutyN+'</div><div class="mut">за '+st.tot+' дн. с первых суток</div></div>';
 const pm=Math.max(1,...Object.values(st.post));
 h+='<h2>Посты</h2><div class="card">';const pr=[];for(let p=4;p<=9;p++)pr.push(['Пост '+p,st.post[p]||0]);pr.sort((a,b)=>b[1]-a[1]).forEach(x=>h+=row(x[0],x[1],pm));
 h+='</div><h2>Смены и другие наряды</h2><div class="card">';[['Смена 1',st.shift[1]||0,'#7a8a52'],['Смена 2',st.shift[2]||0,'#7a8a52'],['КП',st.cnt['кп']||0,col('кп')],['Усиление',st.cnt['у']||0,col('у')],['Караул',st.cnt['н']||0,col('н')]].sort((a,b)=>b[1]-a[1]).forEach(x=>h+=row(x[0],x[1],Math.max(1,pm,st.cnt['кп']||0,st.cnt['у']||0,st.shift[1]||0,st.shift[2]||0),x[2]));h+='</div>';
 const g=st.gaps,gm=Math.max(1,g[1]||0,g[2]||0,g[3]||0,g[4]||0,g[5]||0);
 h+='<h2>Как часто ходил</h2><div class="card">'+[['Через сутки',g[2]||0],['Через двое',g[3]||0],['Через трое',g[4]||0],['Через четверо',g[5]||0],['Подряд',g[1]||0]].sort((a,b)=>b[1]-a[1]).map(x=>row(x[0],x[1],gm)).join('')+'<div class="mut" style="margin-top:6px">Через сутки: наряд, отсыпной и сразу следующий наряд.</div></div>';
 const nm={'н':'Караул','кп':'КП','у':'Усиление','оц':'Оцепление','з':'Занятия','р':'Рабочие','к':'Командировка','б':'Больничный','в':'Выходные','о':'Отсыпные','отп':'Отпуск','удн':'Учения дневные','усу':'Учения суточные'},ol=[['Сутки (наряды)',st.dutyN,POSTC]];keys.forEach(k=>{if(st.cnt[k])ol.push([nm[k],st.cnt[k],col(k)])});ol.sort((a,b)=>b[1]-a[1]);const dm=Math.max(1,ol[0][1]);
 h+='<h2>Остальные дни</h2><div class="card">';ol.forEach(x=>h+=row(x[0],x[1],dm,x[2]));h+='</div>';
 const mk=Object.keys(st.mon).sort(),mm=Math.max(1,...Object.values(st.mon));
 h+='<h2>Наряды по месяцам</h2><div class="card">';mk.forEach(k=>h+=row(MN[+k.slice(5)-1].slice(0,3)+' '+k.slice(2,4),st.mon[k],mm));h+='</div>';
 return h}

function settings(){return '<h1 style="font-size:28px">Настройки</h1><div class="card"><label>Начало контракта</label><input type="date" id="s" value="'+S.start+'"><label>Конец контракта</label><input type="date" id="e" value="'+S.end+'"><div class="mut">Статистика начинается с первых суток в графике. Всё, что было раньше (КМБ, стажировки), не учитывается.</div><div class="flex"><button onclick="saveDates()">Сохранить даты</button></div><p class="warn">'+msg+'</p></div>'+
 '<div class="card"><b>Резервная копия</b><div class="mut">Данные хранятся только в этом браузере. Сохрани файл и держи его в телефоне или облаке: из него можно восстановить всё.</div><div class="flex"><button onclick="exportFile()">Сохранить файл</button><button class="sec" onclick="exportCsv()">Таблица CSV</button></div><label>Загрузить из файла</label><input type="file" onchange="impFile(this)"><div class="mut" style="margin-top:8px">Если файл не открывается, можно через текст:</div><div class="flex"><button class="sec" onclick="exp()">Показать как текст</button><button class="sec" onclick="imp()">Загрузить из текста</button></div><textarea id="bk" rows="6" style="margin-top:8px"></textarea></div>'+
 '<div class="card"><button class="sec" onclick="if(confirm(\'Удалить все данные?\')){S={start:\'\',end:\'\',days:{},filled:{}};save();render()}">Удалить все данные</button></div>'}
function exp(){$('#bk').value=JSON.stringify(S)}
function saveFile(name,data){try{const b=new Blob([data],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove()}catch(e){msg='Не удалось сохранить файл. Используй текст ниже.';render()}}
function exportFile(){saveFile('kontrakt-'+today()+'.json',JSON.stringify(S))}
function exportCsv(){const L=['Дата;Код'];Object.keys(S.days).sort().forEach(k=>{const c=S.days[k];L.push(k+';'+(isPost(c)?'Пост '+c[0]+' смена '+c[2]:lab(c)))});saveFile('grafik-'+today()+'.csv',String.fromCharCode(65279)+L.join(String.fromCharCode(13,10)))}
function impFile(el){const f=el.files&&el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.days)throw 0;S=Object.assign({start:'',end:'',days:{},filled:{}},o);save();msg='';render()}catch(e){msg='Не удалось прочитать файл';render()}};r.readAsText(f)}
function imp(){try{const o=JSON.parse($('#bk').value);if(!o.days)throw 0;S=Object.assign({start:'',end:'',days:{},filled:{}},o);save();msg='';render()}catch(e){msg='Не удалось прочитать данные';render()}}

function render(){const ready=S.start&&S.end;
 $('#nav').style.display=ready?'flex':'none';
 if(!ready){$('#app').innerHTML=setup();return}
 const t=[['home','Главная'],['cal','Календарь'],['st','Статистика'],['set','Настройки']];
 $('#nav').innerHTML=t.map(x=>'<button class="'+(tab===x[0]?'on':'')+'" onclick="tab=\''+x[0]+'\';msg=\'\';render()">'+x[1]+'</button>').join('');
 $('#app').innerHTML=tab==='home'?home():tab==='cal'?cal()+legend():tab==='st'?statsView():settings()}
try{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');x.fillStyle='#4a5a2b';x.fillRect(0,0,180,180);x.fillStyle='#e3d9a6';x.beginPath();for(let i=0;i<10;i++){const r=i%2?32:76,a=-Math.PI/2+i*Math.PI/5;x[i?'lineTo':'moveTo'](90+r*Math.cos(a),94+r*Math.sin(a))}x.closePath();x.fill();document.getElementById('ati').href=c.toDataURL('image/png')}catch(e){}
render();
</script></body></html>
